[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "multisensor-synth"
version = "0.1.0"
description = "Reproducible multisensor synthetic truth timeline generator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2,<3",
  "pyarrow>=19,<26",
  "pydantic>=2.12,<3",
  "PyYAML>=6.0,<7",
]

[project.scripts]
multisensor-synth = "multisensor_synth.cli:main"
multisensor-synth-beta = "multisensor_synth.beta_observed.cli:main"

[project.optional-dependencies]
beta-observed = [
  "neurokit2==0.2.13",
  "synapbridge-beta-runtime",
]

[tool.uv.sources]
synapbridge-beta-runtime = { path = "../multisensor_ml/.worktrees/kaggle-ml-dl-benchmark/beta_runtime", editable = true }

[dependency-groups]
dev = [
  "hypothesis>=6.130,<7",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/multisensor_synth"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["multisensor_synth"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["synapbridge_beta_runtime", "synapbridge_beta_runtime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["neurokit2", "scipy", "scipy.*"]
ignore_missing_imports = true
